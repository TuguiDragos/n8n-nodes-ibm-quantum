name: Website

# n8n-nodes-ibm-quantum.tuguidragos.com is built from this repository on every push to main, so the figures it quotes
# (the operations, the unit tests and their coverage, the hardware record, the version) follow the code without anyone
# editing the page. A build whose figures or quoted sentences no longer hold fails here, and the site already published
# stays as it was.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            website/package-lock.json
      # Install scripts are skipped for the same reason as in CI: isolated-vm is not needed to build or test.
      - run: npm ci --ignore-scripts
      - run: npm ci --prefix website
      - run: website/build.sh
      - uses: actions/upload-pages-artifact@v5
        with:
          path: website/_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
