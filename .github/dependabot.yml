version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      # Monthly, on the first of the month, the day scan.yml runs the verification scanner too.
      # n8n ships a minor every Tuesday and patches on most other days, so one grouped PR a month
      # collects them. The schedule governs version updates only: a security update still opens
      # as soon as Dependabot raises an alert. The n8n-workflow pin does not wait for this either,
      # since AGENTS.md has it checked by hand every week.
      interval: monthly
    open-pull-requests-limit: 5
    # Batch minor and patch bumps into a single PR to cut review noise.
    groups:
      npm-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
    # Toolchain bumps that need manual compatibility work. Each entry below says which bumps it
    # blocks and why; eslint and @eslint/js are the two blocked at every level, not just at a major.
    ignore:
      # TypeScript 7 removes moduleResolution=node10 (which tsconfig.json uses) and the current
      # typescript-eslint cannot load against it. Moving up needs a manual tsconfig migration.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @n8n/eslint-plugin-community-nodes peer-depends on eslint exactly 9.29.0, so ANY eslint
      # bump (not just a major) produces a PR that cannot install. The version is pinned exactly
      # in package.json and moves only when the n8n plugin's peer moves.
      - dependency-name: eslint
      # @eslint/js is eslint's own recommended ruleset, pinned to the same 9.29.0 so its
      # recommended set can never name a rule this eslint lacks. It moves together with eslint.
      - dependency-name: "@eslint/js"
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: "@vitest/coverage-v8"
        update-types: [version-update:semver-major]
      # The node targets the n8n v2 line; a v3 major is a deliberate, manual migration. Minor
      # bumps still need a manual check: n8n-workflow's npm dist-tags are not conventional
      # (`latest` trails well behind `stable`, `beta` runs ahead, and `stable` itself can lag the
      # n8n release), so confirm the proposed version is the one n8n's stable release ships,
      # `npm view n8n dependencies.n8n-workflow`, before merging.
      - dependency-name: n8n-workflow
        update-types: [version-update:semver-major]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One grouped PR for all GitHub Actions bumps instead of one per action.
    groups:
      github-actions:
        patterns:
          - "*"
