<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="452" viewBox="0 0 1200 452" role="img" aria-labelledby="ht hd">
<title id="ht">n8n-nodes-ibm-quantum</title>
<desc id="hd">Build, run and retrieve quantum circuits on the IBM Quantum Platform from n8n. A Bell state measured on ibm_kingston lands almost entirely in 00 and 11.</desc>
<defs>
  <linearGradient id="ground" x1="0" y1="0" x2="1200" y2="452" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#1a1d2e"/><stop offset="1" stop-color="#121422"/>
  </linearGradient>
  <radialGradient id="halo" cx="1008" cy="226" r="400" gradientUnits="userSpaceOnUse">
    <stop offset="0" stop-color="#9184d9" stop-opacity="0.16"/><stop offset="1" stop-color="#9184d9" stop-opacity="0"/>
  </radialGradient>
  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace; }
    .ui { font-family: Inter, system-ui, -apple-system, sans-serif; }
    .p { fill: #9184d9; }
    .cmd { fill: #e9e9ed; }
    .cmt { fill: #6e7189; }
    .jb { fill: #6e7189; }
    .jk { fill: #a89ce4; }
    .jv { fill: #c8cadb; }
    .cur { fill: #9184d9; animation: blink 1.1s step-end infinite; }
    .bar { transform-box: fill-box; transform-origin: bottom; transform: scaleY(0); opacity: 0;
           animation: grow 8.4s cubic-bezier(0.16, 0.84, 0.55, 1) infinite; }
    .val { opacity: 0; transform-box: fill-box; transform-origin: center bottom;
           animation: show 8.4s cubic-bezier(0.16, 0.84, 0.55, 1) infinite; }
    .b0 { animation-delay: 0.00s }
    .v0 { animation-delay: 0.00s }
    .b1 { animation-delay: 0.17s }
    .v1 { animation-delay: 0.17s }
    .b2 { animation-delay: 0.34s }
    .v2 { animation-delay: 0.34s }
    .b3 { animation-delay: 0.51s }
    .v3 { animation-delay: 0.51s }

    @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
    @keyframes grow {
      0%        { transform: scaleY(0); opacity: 0 }
      3%        { opacity: 1 }
      22%       { transform: scaleY(1); opacity: 1 }
      91%       { transform: scaleY(1); opacity: 1 }
      93.5%     { transform: scaleY(0.04); opacity: 0 }
      100%      { transform: scaleY(0); opacity: 0 }
    }
    @keyframes show {
      0%, 4%    { opacity: 0; transform: translateY(6px) scale(0.86) }
      20%       { opacity: 1; transform: translateY(0) scale(1) }
      91%       { opacity: 1; transform: translateY(0) scale(1) }
      93.5%     { opacity: 0; transform: translateY(6px) scale(0.92) }
      100%      { opacity: 0; transform: translateY(6px) scale(0.92) }
    }
  </style>
</defs>

<rect width="1200" height="452" rx="14" fill="url(#ground)"/>
<rect width="1200" height="452" rx="14" fill="url(#halo)"/>
<rect x="0.5" y="0.5" width="1199" height="451" rx="14" fill="none" stroke="#2b2e46"/>

<g transform="translate(1008 0)">
  <text x="-152" y="76" class="ui" font-size="13" font-weight="600" fill="#e9e9ed">Bell state</text>
  <text x="152" y="76" text-anchor="end" class="mono" font-size="11.5" fill="#6e7189">ibm_kingston</text>
  <line x1="-152" y1="92" x2="152" y2="92" stroke="#2b2e46"/>
  <line x1="-152" y1="132.5" x2="152" y2="132.5" stroke="#22253c" stroke-dasharray="2 6"/>
  <line x1="-152" y1="216.5" x2="152" y2="216.5" stroke="#22253c" stroke-dasharray="2 6"/>
  <line x1="-152" y1="300.5" x2="152" y2="300.5" stroke="#343856"/>
  <rect x="-124" y="132" width="44" height="168" rx="4" fill="#9184d9" class="bar b0"/>
  <text x="-102" y="122" text-anchor="middle" class="mono val v0" font-size="11.5" fill="#cfc8f2">498</text>
  <text x="-102" y="321" text-anchor="middle" class="mono" font-size="12" fill="#8e91ad">00</text>
  <rect x="-56" y="290" width="44" height="10" rx="4" fill="#4a4d73" class="bar b1"/>
  <text x="-34" y="280" text-anchor="middle" class="mono val v1" font-size="11.5" fill="#7d80a0">9</text>
  <text x="-34" y="321" text-anchor="middle" class="mono" font-size="12" fill="#8e91ad">01</text>
  <rect x="12" y="286" width="44" height="14" rx="4" fill="#4a4d73" class="bar b2"/>
  <text x="34" y="276" text-anchor="middle" class="mono val v2" font-size="11.5" fill="#7d80a0">21</text>
  <text x="34" y="321" text-anchor="middle" class="mono" font-size="12" fill="#8e91ad">10</text>
  <rect x="80" y="133" width="44" height="167" rx="4" fill="#9184d9" class="bar b3"/>
  <text x="102" y="123" text-anchor="middle" class="mono val v3" font-size="11.5" fill="#cfc8f2">496</text>
  <text x="102" y="321" text-anchor="middle" class="mono" font-size="12" fill="#8e91ad">11</text>
  <text x="0" y="360" text-anchor="middle" class="mono" font-size="11.5" fill="#6e7189">1,024 shots <tspan fill="#3d3f60">&#183;</tspan> <tspan fill="#a89ce4">97% in 00 and 11</tspan></text>
</g>

<rect x="56" y="48" width="760" height="356" rx="10" fill="#101220" stroke="#2b2e46"/>
<path d="M56 84h760" stroke="#2b2e46"/>
<circle cx="80" cy="66" r="4.5" fill="#343856"/>
<circle cx="98" cy="66" r="4.5" fill="#343856"/>
<circle cx="116" cy="66" r="4.5" fill="#9184d9" opacity="0.55"/>
<text x="140" y="71" class="mono" font-size="13" fill="#6e7189">zsh &#183; n8n</text>

<g class="mono">
  <text x="84" y="118" class="p" font-size="16">$</text>
  <text x="100" y="118" class="cmd" font-size="16">npm i n8n-nodes-ibm-quantum</text>
  <text x="100" y="144" class="jb" font-size="14.5">added 1 package in 1s</text>

  <text x="84" y="180" class="p" font-size="16">$</text>
  <text x="100" y="180" class="cmt" font-size="16"># IBM Quantum &#183; Job &#183; Get Results</text>

  <text x="100" y="210" class="jb" font-size="14.5">{</text>
  <text x="118" y="232" class="jk" font-size="14.5">"pubCount":</text>
  <text x="236" y="232" class="jv" font-size="14.5">1,</text>
  <text x="118" y="254" class="jk" font-size="14.5">"pubs":</text>
  <text x="236" y="254" class="jb" font-size="14.5">[{</text>
  <text x="136" y="276" class="jk" font-size="14.5">"type":</text>
  <text x="254" y="276" class="jv" font-size="14.5">"sampler",</text>
  <text x="136" y="298" class="jk" font-size="14.5">"shots":</text>
  <text x="254" y="298" class="jv" font-size="14.5">1024,</text>
  <text x="136" y="320" class="jk" font-size="14.5">"counts":</text>
  <text x="254" y="320" class="jb" font-size="14.5">{ <tspan class="jk">"00"</tspan>: <tspan class="jv">498</tspan>, <tspan class="jk">"01"</tspan>: <tspan class="jv">9</tspan>, <tspan class="jk">"10"</tspan>: <tspan class="jv">21</tspan>, <tspan class="jk">"11"</tspan>: <tspan class="jv">496</tspan> }</text>
  <text x="118" y="342" class="jb" font-size="14.5">}]</text>
  <text x="100" y="364" class="jb" font-size="14.5">}</text>

  <text x="84" y="392" class="p" font-size="16">$</text>
</g>
<rect x="100" y="378" width="2.5" height="18" class="cur"/>
</svg>
